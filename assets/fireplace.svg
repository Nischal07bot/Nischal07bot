<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120">
  <defs>
    <style>
      @keyframes flame1{0%,100%{transform:scaleY(1);opacity:1}50%{transform:scaleY(0.8);opacity:0.7}}
      @keyframes flame2{0%,100%{transform:scaleY(0.85);opacity:0.8}50%{transform:scaleY(1);opacity:1}}
      @keyframes flame3{0%,100%{transform:scaleY(0.9);opacity:0.9}30%{transform:scaleY(1.05);opacity:1}70%{transform:scaleY(0.75);opacity:0.6}}
      @keyframes spark{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-20px)}}
      @keyframes glow{0%,100%{opacity:0.06}50%{opacity:0.12}}
    </style>
  </defs>

  <!-- Glow -->
  <ellipse cx="140" cy="70" rx="100" ry="40" fill="#E8A530" opacity="0.05" style="animation:glow 2s infinite"/>

  <!-- Brick fireplace -->
  <rect x="60" y="20" width="160" height="90" fill="#5C3A1E" rx="3"/>
  <rect x="55" y="16" width="170" height="8" fill="#6B4828" rx="2"/>
  <!-- Brick pattern -->
  <rect x="62" y="24" width="24" height="10" fill="#6B4828" rx="1" opacity="0.3"/>
  <rect x="90" y="24" width="24" height="10" fill="#6B4828" rx="1" opacity="0.3"/>
  <rect x="118" y="24" width="24" height="10" fill="#6B4828" rx="1" opacity="0.3"/>
  <rect x="146" y="24" width="24" height="10" fill="#6B4828" rx="1" opacity="0.3"/>
  <rect x="174" y="24" width="24" height="10" fill="#6B4828" rx="1" opacity="0.3"/>
  <rect x="74" y="36" width="24" height="10" fill="#6B4828" rx="1" opacity="0.3"/>
  <rect x="102" y="36" width="24" height="10" fill="#6B4828" rx="1" opacity="0.3"/>
  <rect x="130" y="36" width="24" height="10" fill="#6B4828" rx="1" opacity="0.3"/>
  <rect x="158" y="36" width="24" height="10" fill="#6B4828" rx="1" opacity="0.3"/>
  <rect x="186" y="36" width="24" height="10" fill="#6B4828" rx="1" opacity="0.3"/>

  <!-- Opening -->
  <path d="M90 100 L90 55 Q140 40 190 55 L190 100 Z" fill="#1a1a2e"/>

  <!-- Logs -->
  <rect x="100" y="88" width="80" height="10" fill="#3D2A1A" rx="3" transform="rotate(-5 140 93)"/>
  <rect x="105" y="84" width="70" height="10" fill="#4A3520" rx="3" transform="rotate(4 140 89)"/>
  <rect x="115" y="80" width="50" height="8" fill="#362316" rx="3"/>

  <!-- Flames -->
  <g transform-origin="125 80">
    <ellipse cx="125" cy="72" rx="8" ry="18" fill="#E06C48" style="animation:flame1 0.6s infinite"/>
    <ellipse cx="125" cy="68" rx="5" ry="12" fill="#E8A530" opacity="0.8" style="animation:flame2 0.5s infinite"/>
  </g>
  <g transform-origin="140 80">
    <ellipse cx="140" cy="68" rx="10" ry="22" fill="#E06C48" style="animation:flame2 0.55s infinite"/>
    <ellipse cx="140" cy="62" rx="6" ry="14" fill="#E8A530" opacity="0.8" style="animation:flame3 0.4s infinite"/>
    <ellipse cx="140" cy="56" rx="3" ry="8" fill="#FFD080" opacity="0.6" style="animation:flame1 0.45s infinite"/>
  </g>
  <g transform-origin="155 80">
    <ellipse cx="155" cy="70" rx="8" ry="20" fill="#E06C48" style="animation:flame3 0.65s infinite"/>
    <ellipse cx="155" cy="66" rx="5" ry="12" fill="#E8A530" opacity="0.8" style="animation:flame1 0.5s infinite"/>
  </g>

  <!-- Sparks -->
  <circle cx="130" cy="55" r="1.2" fill="#FFD080" style="animation:spark 1.5s 0s infinite"/>
  <circle cx="145" cy="50" r="1" fill="#FFD080" style="animation:spark 1.8s 0.5s infinite"/>
  <circle cx="152" cy="54" r="0.8" fill="#FFD080" style="animation:spark 1.3s 1s infinite"/>
  <circle cx="138" cy="48" r="1" fill="#FFD080" style="animation:spark 2s 0.3s infinite"/>

  <!-- Mantle decorations -->
  <rect x="70" y="10" width="12" height="8" fill="#E0D5C8" rx="1"/>
  <rect x="195" y="10" width="12" height="8" fill="#E0D5C8" rx="1"/>
</svg>
