<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80">
  <defs>
    <style>
      @keyframes twinkle{0%,100%{opacity:0.15}50%{opacity:0.9}}
      @keyframes moonGlow{0%,100%{opacity:0.05}50%{opacity:0.1}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
    </style>
  </defs>

  <g style="animation:float 6s ease-in-out infinite">
    <!-- Moon glow -->
    <circle cx="100" cy="35" r="30" fill="#E8DCC8" opacity="0.04" style="animation:moonGlow 4s infinite"/>
    
    <!-- Moon -->
    <circle cx="100" cy="35" r="18" fill="#E8DCC8"/>
    <circle cx="93" cy="28" r="15" fill="#1a1a2e"/>
    
    <!-- Moon craters -->
    <circle cx="105" cy="30" r="2" fill="#D4C4B0" opacity="0.3"/>
    <circle cx="110" cy="38" r="1.5" fill="#D4C4B0" opacity="0.25"/>
    <circle cx="100" cy="42" r="1.8" fill="#D4C4B0" opacity="0.2"/>

    <!-- Stars -->
    <circle cx="30" cy="20" r="1.5" fill="#E8DCC8" style="animation:twinkle 3s 0s infinite"/>
    <circle cx="55" cy="45" r="1" fill="#E8DCC8" style="animation:twinkle 4s 1s infinite"/>
    <circle cx="40" cy="60" r="1.2" fill="#E8DCC8" style="animation:twinkle 2.5s 0.5s infinite"/>
    <circle cx="145" cy="15" r="1.3" fill="#E8DCC8" style="animation:twinkle 3.5s 0.8s infinite"/>
    <circle cx="160" cy="50" r="1" fill="#E8DCC8" style="animation:twinkle 2.8s 1.5s infinite"/>
    <circle cx="175" cy="25" r="1.5" fill="#E8DCC8" style="animation:twinkle 3.2s 0.3s infinite"/>
    <circle cx="70" cy="15" r="0.8" fill="#E8DCC8" style="animation:twinkle 4.5s 2s infinite"/>
    <circle cx="130" cy="55" r="1.1" fill="#E8DCC8" style="animation:twinkle 3.8s 0.7s infinite"/>
    <circle cx="20" cy="40" r="0.9" fill="#E8DCC8" style="animation:twinkle 2.2s 1.2s infinite"/>
    <circle cx="180" cy="40" r="1.2" fill="#E8DCC8" style="animation:twinkle 3s 1.8s infinite"/>
  </g>

  <!-- Text -->
  <text x="100" y="75" text-anchor="middle" fill="#555" font-family="monospace" font-size="8" opacity="0.6">thanks for visiting</text>
</svg>
