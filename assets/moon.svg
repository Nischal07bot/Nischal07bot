<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <defs>
    <style>
      @keyframes twinkle1 { 0%,100%{opacity:0.2;r:1.5} 50%{opacity:1;r:2} }
      @keyframes twinkle2 { 0%,100%{opacity:0.4;r:1} 50%{opacity:1;r:1.5} }
      @keyframes twinkle3 { 0%,100%{opacity:0.15;r:1} 50%{opacity:0.7;r:1.5} }
      @keyframes moonglow { 0%,100%{opacity:0.08} 50%{opacity:0.15} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
    </style>
  </defs>

  <!-- Night sky -->
  <rect width="200" height="100" fill="#0D1117" rx="8"/>

  <!-- Stars -->
  <circle cx="20" cy="12" r="1.5" fill="#C9D1D9" style="animation:twinkle1 3s infinite"/>
  <circle cx="50" cy="25" r="1" fill="#58A6FF" style="animation:twinkle2 2.5s 0.5s infinite"/>
  <circle cx="80" cy="8" r="1.5" fill="#C9D1D9" style="animation:twinkle3 4s 1s infinite"/>
  <circle cx="130" cy="16" r="1" fill="#58A6FF" style="animation:twinkle1 3.5s 0.3s infinite"/>
  <circle cx="160" cy="28" r="1.5" fill="#C9D1D9" style="animation:twinkle2 2s 0.8s infinite"/>
  <circle cx="180" cy="12" r="1" fill="#58A6FF" style="animation:twinkle3 3s 1.5s infinite"/>
  <circle cx="30" cy="42" r="1" fill="#C9D1D9" style="animation:twinkle1 4s 0.2s infinite"/>
  <circle cx="170" cy="48" r="1" fill="#58A6FF" style="animation:twinkle2 3s 0.7s infinite"/>
  <circle cx="60" cy="55" r="1.5" fill="#C9D1D9" style="animation:twinkle3 2.5s 1.2s infinite"/>
  <circle cx="140" cy="58" r="1" fill="#58A6FF" style="animation:twinkle1 3.5s 0.4s infinite"/>
  <circle cx="15" cy="68" r="1" fill="#C9D1D9" style="animation:twinkle2 4s 0.6s infinite"/>
  <circle cx="185" cy="65" r="1.5" fill="#58A6FF" style="animation:twinkle3 3s 0.9s infinite"/>

  <!-- Moon glow -->
  <circle cx="100" cy="40" r="35" fill="#C9D1D9" opacity="0.04" style="animation:moonglow 3s infinite"/>

  <!-- Moon -->
  <g style="animation:float 8s ease-in-out infinite">
    <circle cx="100" cy="40" r="20" fill="#C9D1D9"/>
    <circle cx="108" cy="35" r="17" fill="#0D1117"/>
    <circle cx="90" cy="34" r="2.5" fill="#B0B8C4" opacity="0.4"/>
    <circle cx="96" cy="46" r="1.5" fill="#B0B8C4" opacity="0.3"/>
  </g>

  <!-- Footer text -->
  <text x="100" y="78" text-anchor="middle" fill="#484F58" font-family="'Courier New',monospace" font-size="10">thanks for stopping by</text>
  <text x="100" y="90" text-anchor="middle" fill="#30363D" font-family="'Courier New',monospace" font-size="8">// end of transmission</text>
</svg>
