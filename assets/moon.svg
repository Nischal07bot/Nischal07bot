<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <defs>
    <style>
      @keyframes twinkle1 { 0%,100%{opacity:0.3;r:1.5} 50%{opacity:1;r:2} }
      @keyframes twinkle2 { 0%,100%{opacity:0.5;r:1} 50%{opacity:1;r:1.5} }
      @keyframes twinkle3 { 0%,100%{opacity:0.2;r:1} 50%{opacity:0.8;r:1.5} }
      @keyframes moonglow { 0%,100%{opacity:0.1} 50%{opacity:0.2} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
    </style>
  </defs>

  <!-- Night sky background -->
  <rect width="200" height="120" fill="#0D1117" rx="10"/>

  <!-- Stars -->
  <circle cx="20" cy="15" r="1.5" fill="#fff" style="animation:twinkle1 3s infinite"/>
  <circle cx="50" cy="30" r="1" fill="#fff" style="animation:twinkle2 2.5s 0.5s infinite"/>
  <circle cx="80" cy="10" r="1.5" fill="#fff" style="animation:twinkle3 4s 1s infinite"/>
  <circle cx="130" cy="20" r="1" fill="#fff" style="animation:twinkle1 3.5s 0.3s infinite"/>
  <circle cx="160" cy="35" r="1.5" fill="#fff" style="animation:twinkle2 2s 0.8s infinite"/>
  <circle cx="180" cy="15" r="1" fill="#fff" style="animation:twinkle3 3s 1.5s infinite"/>
  <circle cx="30" cy="50" r="1" fill="#fff" style="animation:twinkle1 4s 0.2s infinite"/>
  <circle cx="170" cy="55" r="1" fill="#fff" style="animation:twinkle2 3s 0.7s infinite"/>
  <circle cx="60" cy="65" r="1.5" fill="#fff" style="animation:twinkle3 2.5s 1.2s infinite"/>
  <circle cx="140" cy="70" r="1" fill="#fff" style="animation:twinkle1 3.5s 0.4s infinite"/>
  <circle cx="15" cy="80" r="1" fill="#fff" style="animation:twinkle2 4s 0.6s infinite"/>
  <circle cx="185" cy="80" r="1.5" fill="#fff" style="animation:twinkle3 3s 0.9s infinite"/>

  <!-- Moon glow -->
  <circle cx="100" cy="50" r="45" fill="#FFE4B5" opacity="0.08" style="animation:moonglow 3s infinite"/>
  <circle cx="100" cy="50" r="35" fill="#FFE4B5" opacity="0.1" style="animation:moonglow 3s infinite"/>

  <!-- Moon -->
  <g style="animation:float 6s ease-in-out infinite">
    <circle cx="100" cy="50" r="25" fill="#FFE4B5"/>
    <!-- Crescent shadow -->
    <circle cx="110" cy="45" r="22" fill="#0D1117"/>
    <!-- Moon surface details -->
    <circle cx="88" cy="42" r="3" fill="#EED8A6" opacity="0.5"/>
    <circle cx="95" cy="55" r="2" fill="#EED8A6" opacity="0.4"/>
    <circle cx="84" cy="52" r="1.5" fill="#EED8A6" opacity="0.3"/>
  </g>

  <!-- Text -->
  <text x="100" y="100" text-anchor="middle" fill="#FF6B9D" font-family="'Courier New',monospace" font-size="10" font-weight="bold">thanks for visiting ✨</text>
  <text x="100" y="112" text-anchor="middle" fill="#8B8B8B" font-family="'Courier New',monospace" font-size="8">my tiny world</text>
</svg>
