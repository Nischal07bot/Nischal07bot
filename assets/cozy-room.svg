<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280">
  <defs>
    <style>
      @keyframes flicker { 0%,100%{opacity:1} 50%{opacity:0.5} }
      @keyframes glow { 0%,100%{opacity:0.7} 50%{opacity:1} }
      @keyframes steam { 0%{opacity:0.8;transform:translateY(0)} 100%{opacity:0;transform:translateY(-20px)} }
      @keyframes twinkle { 0%,100%{opacity:0.3} 50%{opacity:1} }
      @keyframes rain { 0%{transform:translateY(-10px);opacity:0} 50%{opacity:0.6} 100%{transform:translateY(90px);opacity:0} }
      @keyframes blink { 0%,90%,100%{height:6px;y:22} 95%{height:1px;y:25} }
      @keyframes type { 0%,100%{fill:#00ff41} 50%{fill:#00cc33} }
      @keyframes cursor { 0%,100%{opacity:1} 50%{opacity:0} }
    </style>
  </defs>

  <!-- Background - Dark room -->
  <rect width="800" height="280" fill="#0D1117"/>

  <!-- Floor -->
  <rect x="0" y="220" width="800" height="60" fill="#161B22"/>
  <rect x="0" y="220" width="800" height="2" fill="#21262D"/>

  <!-- === WINDOW with rain === -->
  <rect x="40" y="30" width="140" height="130" fill="#1a3a5c" stroke="#30363D" stroke-width="4" rx="2"/>
  <rect x="46" y="36" width="62" height="58" fill="#0B1929"/>
  <rect x="112" y="36" width="62" height="58" fill="#0B1929"/>
  <rect x="46" y="98" width="62" height="56" fill="#0B1929"/>
  <rect x="112" y="98" width="62" height="56" fill="#0B1929"/>
  <!-- Moon outside -->
  <circle cx="145" cy="55" r="14" fill="#C9D1D9">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="50" r="12" fill="#0B1929"/>
  <!-- Stars outside -->
  <circle cx="70" cy="50" r="2" fill="#58A6FF" style="animation:twinkle 2s infinite"/>
  <circle cx="90" cy="70" r="1.5" fill="#58A6FF" style="animation:twinkle 3s 0.5s infinite"/>
  <circle cx="130" cy="42" r="1.5" fill="#58A6FF" style="animation:twinkle 2.5s 1s infinite"/>
  <!-- Rain -->
  <line x1="60" y1="40" x2="60" y2="50" stroke="#58A6FF" stroke-width="1" opacity="0.3" style="animation:rain 1s 0s infinite linear"/>
  <line x1="80" y1="45" x2="80" y2="55" stroke="#58A6FF" stroke-width="1" opacity="0.3" style="animation:rain 0.8s 0.3s infinite linear"/>
  <line x1="100" y1="42" x2="100" y2="52" stroke="#58A6FF" stroke-width="1" opacity="0.3" style="animation:rain 1.2s 0.1s infinite linear"/>
  <line x1="120" y1="48" x2="120" y2="58" stroke="#58A6FF" stroke-width="1" opacity="0.3" style="animation:rain 0.9s 0.6s infinite linear"/>
  <line x1="150" y1="44" x2="150" y2="54" stroke="#58A6FF" stroke-width="1" opacity="0.3" style="animation:rain 1.1s 0.4s infinite linear"/>
  <!-- Window sill -->
  <rect x="35" y="160" width="150" height="6" fill="#30363D"/>

  <!-- === DUAL MONITOR DESK === -->
  <rect x="250" y="160" width="350" height="12" fill="#21262D"/>
  <rect x="250" y="172" width="10" height="50" fill="#161B22"/>
  <rect x="590" y="172" width="10" height="50" fill="#161B22"/>

  <!-- === MONITOR 1 (main) === -->
  <rect x="290" y="100" width="130" height="85" fill="#1C1C1C" rx="3"/>
  <rect x="296" y="106" width="118" height="70" fill="#0D1117" rx="1"/>
  <!-- Code on screen 1 -->
  <rect x="302" y="112" width="40" height="3" fill="#C678DD" rx="1"/>
  <rect x="346" y="112" width="25" height="3" fill="#58A6FF" rx="1"/>
  <rect x="308" y="118" width="55" height="3" fill="#39D353" rx="1" style="animation:type 2s infinite"/>
  <rect x="308" y="124" width="35" height="3" fill="#E5C07B" rx="1"/>
  <rect x="348" y="124" width="20" height="3" fill="#58A6FF" rx="1"/>
  <rect x="308" y="130" width="45" height="3" fill="#39D353" rx="1"/>
  <rect x="308" y="136" width="60" height="3" fill="#C678DD" rx="1"/>
  <rect x="302" y="142" width="30" height="3" fill="#E06C75" rx="1"/>
  <rect x="336" y="142" width="40" height="3" fill="#58A6FF" rx="1"/>
  <rect x="308" y="148" width="50" height="3" fill="#39D353" rx="1" style="animation:type 2s 1s infinite"/>
  <rect x="308" y="154" width="25" height="3" fill="#E5C07B" rx="1"/>
  <rect x="308" y="160" width="42" height="3" fill="#C678DD" rx="1"/>
  <!-- Cursor blink -->
  <rect x="354" y="148" width="2" height="6" fill="#39D353" style="animation:cursor 1s steps(1) infinite"/>
  <!-- Monitor stand -->
  <rect x="345" y="185" width="20" height="10" fill="#1C1C1C"/>

  <!-- === MONITOR 2 (side) === -->
  <rect x="440" y="108" width="100" height="70" fill="#1C1C1C" rx="3"/>
  <rect x="445" y="113" width="90" height="58" fill="#0D1117" rx="1"/>
  <!-- Terminal on screen 2 -->
  <rect x="450" y="118" width="30" height="3" fill="#39D353" rx="1"/>
  <rect x="482" y="118" width="20" height="3" fill="#C9D1D9" rx="1"/>
  <rect x="450" y="124" width="45" height="3" fill="#C9D1D9" rx="1"/>
  <rect x="450" y="130" width="35" height="3" fill="#58A6FF" rx="1"/>
  <rect x="450" y="136" width="50" height="3" fill="#C9D1D9" rx="1"/>
  <rect x="450" y="142" width="25" height="3" fill="#39D353" rx="1"/>
  <rect x="477" y="142" width="2" height="5" fill="#39D353" style="animation:cursor 1s steps(1) infinite"/>
  <!-- Monitor stand -->
  <rect x="480" y="178" width="20" height="10" fill="#1C1C1C"/>

  <!-- === KEYBOARD === -->
  <rect x="310" y="195" width="90" height="12" fill="#2D2D2D" rx="2"/>
  <rect x="314" y="197" width="6" height="3" fill="#3D3D3D" rx="0.5"/>
  <rect x="322" y="197" width="6" height="3" fill="#3D3D3D" rx="0.5"/>
  <rect x="330" y="197" width="6" height="3" fill="#3D3D3D" rx="0.5"/>
  <rect x="338" y="197" width="6" height="3" fill="#3D3D3D" rx="0.5"/>
  <rect x="346" y="197" width="6" height="3" fill="#3D3D3D" rx="0.5"/>
  <rect x="354" y="197" width="6" height="3" fill="#3D3D3D" rx="0.5"/>
  <rect x="362" y="197" width="6" height="3" fill="#3D3D3D" rx="0.5"/>
  <rect x="370" y="197" width="6" height="3" fill="#3D3D3D" rx="0.5"/>
  <rect x="378" y="197" width="6" height="3" fill="#3D3D3D" rx="0.5"/>
  <rect x="386" y="197" width="6" height="3" fill="#3D3D3D" rx="0.5"/>
  <rect x="318" y="202" width="6" height="3" fill="#3D3D3D" rx="0.5"/>
  <rect x="326" y="202" width="6" height="3" fill="#3D3D3D" rx="0.5"/>
  <rect x="334" y="202" width="6" height="3" fill="#3D3D3D" rx="0.5"/>
  <rect x="342" y="202" width="6" height="3" fill="#3D3D3D" rx="0.5"/>
  <rect x="350" y="202" width="6" height="3" fill="#3D3D3D" rx="0.5"/>
  <rect x="358" y="202" width="6" height="3" fill="#3D3D3D" rx="0.5"/>
  <rect x="366" y="202" width="6" height="3" fill="#3D3D3D" rx="0.5"/>
  <rect x="374" y="202" width="6" height="3" fill="#3D3D3D" rx="0.5"/>
  <rect x="382" y="202" width="6" height="3" fill="#3D3D3D" rx="0.5"/>

  <!-- === PIXEL CHARACTER === -->
  <!-- Head -->
  <rect x="370" y="86" width="24" height="24" fill="#D4A574" rx="2"/>
  <!-- Hair -->
  <rect x="368" y="82" width="28" height="10" fill="#1C1C1C" rx="2"/>
  <rect x="368" y="86" width="6" height="12" fill="#1C1C1C"/>
  <!-- Eyes -->
  <rect x="376" y="94" width="5" height="6" fill="#0D1117" rx="1" style="animation:blink 5s infinite"/>
  <rect x="385" y="94" width="5" height="6" fill="#0D1117" rx="1" style="animation:blink 5s 0.1s infinite"/>
  <!-- Mouth -->
  <rect x="380" y="104" width="6" height="2" fill="#B8896A" rx="1"/>
  <!-- Body (hoodie) -->
  <rect x="366" y="110" width="32" height="30" fill="#2D333B" rx="2"/>
  <!-- Hoodie hood -->
  <rect x="378" y="110" width="8" height="6" fill="#22272E"/>
  <!-- Arms -->
  <rect x="356" y="118" width="14" height="8" fill="#2D333B" rx="2"/>
  <rect x="394" y="118" width="14" height="8" fill="#2D333B" rx="2"/>
  <!-- Hands on keyboard -->
  <rect x="348" y="120" width="8" height="6" fill="#D4A574" rx="1"/>
  <rect x="408" y="120" width="8" height="6" fill="#D4A574" rx="1"/>
  <!-- Chair -->
  <rect x="360" y="138" width="44" height="40" fill="#21262D" rx="3"/>
  <rect x="364" y="142" width="36" height="32" fill="#2D333B" rx="2"/>

  <!-- === COFFEE === -->
  <rect x="280" y="178" width="18" height="22" fill="#30363D" rx="2"/>
  <rect x="280" y="178" width="18" height="5" fill="#6F4E37" rx="2"/>
  <rect x="298" y="182" width="6" height="12" fill="none" stroke="#30363D" stroke-width="2" rx="3"/>
  <!-- Steam -->
  <line x1="285" y1="176" x2="285" y2="166" stroke="#484F58" stroke-width="1.5" opacity="0.3" style="animation:steam 2s infinite"/>
  <line x1="290" y1="174" x2="290" y2="162" stroke="#484F58" stroke-width="1.5" opacity="0.3" style="animation:steam 2s 0.7s infinite"/>
  <line x1="295" y1="176" x2="295" y2="164" stroke="#484F58" stroke-width="1.5" opacity="0.3" style="animation:steam 2s 1.3s infinite"/>

  <!-- === HEADPHONES on desk === -->
  <path d="M555 185 Q555 170 565 170 Q575 170 575 185" fill="none" stroke="#484F58" stroke-width="3"/>
  <rect x="550" y="183" width="8" height="12" fill="#2D333B" rx="2"/>
  <rect x="572" y="183" width="8" height="12" fill="#2D333B" rx="2"/>

  <!-- === BOOKSHELF === -->
  <rect x="660" y="40" width="110" height="180" fill="#21262D" stroke="#30363D" stroke-width="2"/>
  <rect x="660" y="90" width="110" height="3" fill="#30363D"/>
  <rect x="660" y="140" width="110" height="3" fill="#30363D"/>
  <!-- Books row 1 -->
  <rect x="668" y="48" width="12" height="40" fill="#E06C75" rx="1"/>
  <rect x="682" y="52" width="10" height="36" fill="#58A6FF" rx="1"/>
  <rect x="694" y="46" width="14" height="42" fill="#E5C07B" rx="1"/>
  <rect x="710" y="50" width="10" height="38" fill="#C678DD" rx="1"/>
  <rect x="722" y="48" width="12" height="40" fill="#39D353" rx="1"/>
  <rect x="736" y="54" width="10" height="34" fill="#E06C75" rx="1"/>
  <rect x="748" y="46" width="14" height="42" fill="#58A6FF" rx="1"/>
  <!-- Books row 2 -->
  <rect x="668" y="98" width="14" height="40" fill="#39D353" rx="1"/>
  <rect x="684" y="102" width="10" height="36" fill="#E5C07B" rx="1"/>
  <rect x="696" y="96" width="12" height="42" fill="#C678DD" rx="1"/>
  <rect x="710" y="100" width="14" height="38" fill="#58A6FF" rx="1"/>
  <rect x="726" y="98" width="10" height="40" fill="#E06C75" rx="1"/>
  <rect x="738" y="104" width="12" height="34" fill="#39D353" rx="1"/>
  <rect x="752" y="96" width="10" height="42" fill="#E5C07B" rx="1"/>
  <!-- Books row 3 -->
  <rect x="668" y="148" width="10" height="38" fill="#58A6FF" rx="1"/>
  <rect x="680" y="146" width="14" height="42" fill="#C678DD" rx="1"/>
  <rect x="696" y="150" width="12" height="36" fill="#39D353" rx="1"/>
  <rect x="710" y="148" width="10" height="40" fill="#E06C75" rx="1"/>

  <!-- === RGB LED STRIP under desk === -->
  <rect x="255" y="158" width="340" height="2" fill="#58A6FF" opacity="0.3">
    <animate attributeName="fill" values="#58A6FF;#C678DD;#39D353;#58A6FF" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- === SMALL LAMP on desk edge === -->
  <rect x="554" y="150" width="4" height="20" fill="#484F58"/>
  <ellipse cx="556" cy="148" rx="12" ry="6" fill="#39D353" opacity="0.08" style="animation:glow 3s infinite"/>
  <circle cx="556" cy="148" r="4" fill="#39D353" opacity="0.5" style="animation:flicker 1.5s infinite"/>

  <!-- === AMBIENT PARTICLES === -->
  <circle cx="100" cy="200" r="1" fill="#58A6FF" opacity="0.2" style="animation:twinkle 3s infinite"/>
  <circle cx="500" cy="100" r="1" fill="#39D353" opacity="0.15" style="animation:twinkle 4s 1s infinite"/>
  <circle cx="300" cy="80" r="1" fill="#58A6FF" opacity="0.2" style="animation:twinkle 3.5s 0.5s infinite"/>
  <circle cx="620" cy="150" r="1" fill="#C678DD" opacity="0.15" style="animation:twinkle 2.5s 1.5s infinite"/>
</svg>
