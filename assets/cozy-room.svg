<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280">
  <defs>
    <style>
      @keyframes flicker { 0%,100%{opacity:1} 50%{opacity:0.5} }
      @keyframes glow { 0%,100%{opacity:0.7} 50%{opacity:1} }
      @keyframes steam { 0%{opacity:0.8;transform:translateY(0)} 100%{opacity:0;transform:translateY(-20px)} }
      @keyframes twinkle { 0%,100%{opacity:0.3} 50%{opacity:1} }
      @keyframes rain { 0%{transform:translateY(-10px);opacity:0} 50%{opacity:0.6} 100%{transform:translateY(90px);opacity:0} }
      @keyframes blink { 0%,90%,100%{height:6px} 95%{height:1px} }
      @keyframes type { 0%,100%{fill:#00ff41} 50%{fill:#00cc33} }
    </style>
  </defs>

  <!-- Background - Dark cozy room -->
  <rect width="800" height="280" fill="#1a1a2e"/>

  <!-- Floor -->
  <rect x="0" y="220" width="800" height="60" fill="#2d1810"/>
  <rect x="0" y="220" width="800" height="3" fill="#3d2818"/>

  <!-- Wall texture lines -->
  <line x1="0" y1="110" x2="800" y2="110" stroke="#1e1e3a" stroke-width="1" opacity="0.3"/>

  <!-- === WINDOW with rain === -->
  <rect x="40" y="30" width="140" height="130" fill="#2E5C8A" stroke="#8B7355" stroke-width="6" rx="3"/>
  <!-- Window panes -->
  <rect x="46" y="36" width="62" height="58" fill="#1a3a5c"/>
  <rect x="112" y="36" width="62" height="58" fill="#1a3a5c"/>
  <rect x="46" y="98" width="62" height="56" fill="#1a3a5c"/>
  <rect x="112" y="98" width="62" height="56" fill="#1a3a5c"/>
  <!-- Moon outside window -->
  <circle cx="145" cy="55" r="14" fill="#FFE4B5">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="50" r="12" fill="#1a3a5c"/>
  <!-- Stars outside -->
  <circle cx="70" cy="50" r="2" fill="#fff" style="animation:twinkle 2s infinite"/>
  <circle cx="90" cy="70" r="1.5" fill="#fff" style="animation:twinkle 3s 0.5s infinite"/>
  <circle cx="130" cy="42" r="1.5" fill="#fff" style="animation:twinkle 2.5s 1s infinite"/>
  <!-- Rain drops -->
  <line x1="60" y1="40" x2="60" y2="50" stroke="#6ca6cd" stroke-width="1" opacity="0.4" style="animation:rain 1s 0s infinite linear"/>
  <line x1="80" y1="45" x2="80" y2="55" stroke="#6ca6cd" stroke-width="1" opacity="0.4" style="animation:rain 0.8s 0.3s infinite linear"/>
  <line x1="100" y1="42" x2="100" y2="52" stroke="#6ca6cd" stroke-width="1" opacity="0.4" style="animation:rain 1.2s 0.1s infinite linear"/>
  <line x1="120" y1="48" x2="120" y2="58" stroke="#6ca6cd" stroke-width="1" opacity="0.4" style="animation:rain 0.9s 0.6s infinite linear"/>
  <line x1="150" y1="44" x2="150" y2="54" stroke="#6ca6cd" stroke-width="1" opacity="0.4" style="animation:rain 1.1s 0.4s infinite linear"/>
  <!-- Window sill -->
  <rect x="35" y="160" width="150" height="8" fill="#8B7355"/>

  <!-- === DESK === -->
  <rect x="250" y="160" width="350" height="12" fill="#5C3A1E"/>
  <rect x="250" y="172" width="10" height="50" fill="#4A2E16"/>
  <rect x="590" y="172" width="10" height="50" fill="#4A2E16"/>

  <!-- === LAPTOP === -->
  <rect x="330" y="110" width="120" height="80" fill="#2c2c2c" rx="4"/>
  <!-- Screen -->
  <rect x="336" y="116" width="108" height="65" fill="#0d1117" rx="2"/>
  <!-- Code lines on screen -->
  <rect x="342" y="124" width="50" height="4" fill="#00ff41" rx="1" style="animation:type 2s infinite"/>
  <rect x="342" y="132" width="70" height="4" fill="#00cc33" rx="1" opacity="0.7"/>
  <rect x="342" y="140" width="40" height="4" fill="#00ff41" rx="1" opacity="0.5"/>
  <rect x="342" y="148" width="60" height="4" fill="#00cc33" rx="1" opacity="0.6"/>
  <rect x="342" y="156" width="35" height="4" fill="#00ff41" rx="1" style="animation:type 2s 1s infinite"/>
  <rect x="342" y="164" width="55" height="4" fill="#00cc33" rx="1" opacity="0.4"/>
  <!-- Laptop base -->
  <rect x="320" y="190" width="140" height="8" fill="#3c3c3c" rx="2"/>

  <!-- === PIXEL CHARACTER (sitting at desk) === -->
  <!-- Head -->
  <rect x="370" y="86" width="24" height="24" fill="#FFD1A4" rx="2"/>
  <!-- Hair -->
  <rect x="368" y="82" width="28" height="10" fill="#2c1810" rx="2"/>
  <rect x="368" y="86" width="6" height="12" fill="#2c1810"/>
  <!-- Eyes -->
  <rect x="376" y="94" width="5" height="6" fill="#1a1a2e" rx="1" style="animation:blink 4s infinite"/>
  <rect x="385" y="94" width="5" height="6" fill="#1a1a2e" rx="1" style="animation:blink 4s 0.1s infinite"/>
  <!-- Smile -->
  <rect x="379" y="103" width="8" height="2" fill="#e08b6a" rx="1"/>
  <!-- Body (hoodie) -->
  <rect x="366" y="110" width="32" height="30" fill="#4A90E2" rx="2"/>
  <!-- Hoodie details -->
  <rect x="378" y="110" width="8" height="8" fill="#3A7BC8" rx="1"/>
  <!-- Arms reaching to keyboard -->
  <rect x="356" y="118" width="14" height="8" fill="#4A90E2" rx="2"/>
  <rect x="394" y="118" width="14" height="8" fill="#4A90E2" rx="2"/>
  <!-- Hands -->
  <rect x="348" y="120" width="8" height="6" fill="#FFD1A4" rx="1"/>
  <rect x="408" y="120" width="8" height="6" fill="#FFD1A4" rx="1"/>
  <!-- Chair -->
  <rect x="360" y="138" width="44" height="40" fill="#8B4513" rx="3"/>
  <rect x="364" y="142" width="36" height="32" fill="#A0522D" rx="2"/>

  <!-- === COFFEE MUG === -->
  <rect x="480" y="172" width="22" height="28" fill="#E8E8E8" rx="2"/>
  <rect x="480" y="172" width="22" height="6" fill="#D2691E" rx="2"/>
  <!-- Handle -->
  <rect x="502" y="178" width="8" height="14" fill="none" stroke="#E8E8E8" stroke-width="3" rx="4"/>
  <!-- Steam -->
  <line x1="485" y1="170" x2="485" y2="158" stroke="#ccc" stroke-width="2" opacity="0.3" style="animation:steam 2s infinite"/>
  <line x1="491" y1="168" x2="491" y2="154" stroke="#ccc" stroke-width="2" opacity="0.3" style="animation:steam 2s 0.5s infinite"/>
  <line x1="497" y1="170" x2="497" y2="156" stroke="#ccc" stroke-width="2" opacity="0.3" style="animation:steam 2s 1s infinite"/>

  <!-- === PLANT === -->
  <rect x="540" y="172" width="24" height="28" fill="#8B4513" rx="2"/>
  <!-- Leaves -->
  <ellipse cx="552" cy="165" rx="14" ry="10" fill="#228B22"/>
  <ellipse cx="542" cy="158" rx="10" ry="8" fill="#2E8B57"/>
  <ellipse cx="560" cy="160" rx="8" ry="7" fill="#32CD32" opacity="0.8"/>

  <!-- === BOOKSHELF on right wall === -->
  <rect x="660" y="40" width="110" height="180" fill="#5C3A1E" stroke="#4A2E16" stroke-width="2"/>
  <!-- Shelves -->
  <rect x="660" y="90" width="110" height="4" fill="#4A2E16"/>
  <rect x="660" y="140" width="110" height="4" fill="#4A2E16"/>
  <!-- Books row 1 -->
  <rect x="668" y="48" width="12" height="40" fill="#E74C3C" rx="1"/>
  <rect x="682" y="52" width="10" height="36" fill="#3498DB" rx="1"/>
  <rect x="694" y="46" width="14" height="42" fill="#F39C12" rx="1"/>
  <rect x="710" y="50" width="10" height="38" fill="#9B59B6" rx="1"/>
  <rect x="722" y="48" width="12" height="40" fill="#1ABC9C" rx="1"/>
  <rect x="736" y="54" width="10" height="34" fill="#E67E22" rx="1"/>
  <rect x="748" y="46" width="14" height="42" fill="#FF6B9D" rx="1"/>
  <!-- Books row 2 -->
  <rect x="668" y="98" width="14" height="40" fill="#2ECC71" rx="1"/>
  <rect x="684" y="102" width="10" height="36" fill="#E74C3C" rx="1"/>
  <rect x="696" y="96" width="12" height="42" fill="#8E44AD" rx="1"/>
  <rect x="710" y="100" width="14" height="38" fill="#F1C40F" rx="1"/>
  <rect x="726" y="98" width="10" height="40" fill="#3498DB" rx="1"/>
  <rect x="738" y="104" width="12" height="34" fill="#E74C3C" rx="1"/>
  <rect x="752" y="96" width="10" height="42" fill="#2ECC71" rx="1"/>
  <!-- Books row 3 -->
  <rect x="668" y="148" width="10" height="38" fill="#F39C12" rx="1"/>
  <rect x="680" y="146" width="14" height="42" fill="#9B59B6" rx="1"/>
  <rect x="696" y="150" width="12" height="36" fill="#1ABC9C" rx="1"/>
  <rect x="710" y="148" width="10" height="40" fill="#E67E22" rx="1"/>

  <!-- === CANDLE on window sill === -->
  <rect x="60" y="145" width="10" height="16" fill="#FFF8DC" rx="1"/>
  <ellipse cx="65" cy="143" rx="4" ry="6" fill="#FFD700" style="animation:flicker 0.8s infinite"/>
  <ellipse cx="65" cy="141" rx="2" ry="3" fill="#FFF" opacity="0.7" style="animation:flicker 0.5s infinite"/>

  <!-- === LAMP on desk === -->
  <rect x="280" y="130" width="6" height="32" fill="#8B8B8B"/>
  <ellipse cx="283" cy="128" rx="22" ry="12" fill="#FFD700" opacity="0.15"/>
  <path d="M265 130 L283 115 L301 130 Z" fill="#F4A460"/>
  <!-- Lamp glow -->
  <ellipse cx="283" cy="170" rx="35" ry="15" fill="#FFD700" opacity="0.06" style="animation:glow 2s infinite"/>

  <!-- === RUG on floor === -->
  <ellipse cx="400" cy="245" rx="120" ry="20" fill="#8B0000" opacity="0.4"/>
  <ellipse cx="400" cy="245" rx="100" ry="15" fill="#A52A2A" opacity="0.3"/>

  <!-- === CAT sleeping on floor === -->
  <ellipse cx="200" cy="215" rx="18" ry="10" fill="#808080"/>
  <circle cx="185" cy="210" r="7" fill="#808080"/>
  <!-- Cat ears -->
  <polygon points="180,205 183,198 186,205" fill="#808080"/>
  <polygon points="184,205 187,198 190,205" fill="#808080"/>
  <!-- Cat tail -->
  <path d="M218 215 Q230 210 225 200" stroke="#808080" stroke-width="3" fill="none"/>

  <!-- === WARM AMBIENT PARTICLES === -->
  <circle cx="100" cy="200" r="1" fill="#FFD700" opacity="0.3" style="animation:twinkle 3s infinite"/>
  <circle cx="500" cy="100" r="1" fill="#FFD700" opacity="0.2" style="animation:twinkle 4s 1s infinite"/>
  <circle cx="300" cy="80" r="1" fill="#FFD700" opacity="0.3" style="animation:twinkle 3.5s 0.5s infinite"/>
  <circle cx="600" cy="150" r="1" fill="#FFD700" opacity="0.2" style="animation:twinkle 2.5s 1.5s infinite"/>
</svg>
