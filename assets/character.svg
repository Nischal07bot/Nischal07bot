<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80">
  <defs>
    <style>
      @keyframes blink { 0%,42%,46%,100%{height:6px;y:22} 44%{height:1px;y:25} }
      @keyframes breathe { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-1px)} }
      @keyframes wave { 0%,30%,100%{transform:rotate(0deg)} 10%{transform:rotate(-12deg)} 20%{transform:rotate(8deg)} }
      .hand { animation: wave 5s ease-in-out infinite; transform-origin: 48px 38px; }
    </style>
  </defs>

  <g style="animation:breathe 3s ease-in-out infinite">
    <!-- Shadow -->
    <ellipse cx="32" cy="76" rx="16" ry="4" fill="#000" opacity="0.3"/>

    <!-- Feet -->
    <rect x="18" y="64" width="10" height="8" fill="#1C1C1C" rx="2"/>
    <rect x="36" y="64" width="10" height="8" fill="#1C1C1C" rx="2"/>

    <!-- Legs -->
    <rect x="20" y="56" width="8" height="10" fill="#21262D"/>
    <rect x="36" y="56" width="8" height="10" fill="#21262D"/>

    <!-- Body (dark hoodie) -->
    <rect x="16" y="34" width="32" height="24" fill="#2D333B" rx="3"/>

    <!-- Hoodie pocket -->
    <rect x="22" y="46" width="20" height="8" fill="#22272E" rx="2"/>

    <!-- Hoodie strings -->
    <line x1="28" y1="36" x2="28" y2="42" stroke="#484F58" stroke-width="1"/>
    <line x1="36" y1="36" x2="36" y2="42" stroke="#484F58" stroke-width="1"/>

    <!-- Left arm -->
    <rect x="8" y="36" width="10" height="18" fill="#2D333B" rx="3"/>
    <rect x="8" y="50" width="8" height="6" fill="#D4A574" rx="2"/>

    <!-- Right arm (waving) -->
    <g class="hand">
      <rect x="46" y="36" width="10" height="18" fill="#2D333B" rx="3"/>
      <rect x="48" y="50" width="8" height="6" fill="#D4A574" rx="2"/>
    </g>

    <!-- Head -->
    <rect x="20" y="8" width="24" height="26" fill="#D4A574" rx="3"/>

    <!-- Hair -->
    <rect x="18" y="4" width="28" height="14" fill="#1C1C1C" rx="3"/>
    <rect x="18" y="10" width="6" height="10" fill="#1C1C1C" rx="1"/>
    <rect x="42" y="10" width="4" height="8" fill="#1C1C1C" rx="1"/>

    <!-- Eyes -->
    <rect x="26" y="22" width="5" height="6" fill="#0D1117" rx="1" style="animation:blink 5s infinite"/>
    <rect x="35" y="22" width="5" height="6" fill="#0D1117" rx="1" style="animation:blink 5s 0.1s infinite"/>

    <!-- Eye shine -->
    <rect x="27" y="23" width="2" height="2" fill="#fff" opacity="0.6" rx="1"/>
    <rect x="36" y="23" width="2" height="2" fill="#fff" opacity="0.6" rx="1"/>

    <!-- Mouth -->
    <rect x="30" y="30" width="6" height="2" fill="#B8896A" rx="1"/>
  </g>
</svg>
